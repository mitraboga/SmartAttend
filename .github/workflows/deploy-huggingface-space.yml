name: Deploy Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check deployment secrets
        id: check
        run: |
          HF_TOKEN_CLEAN="$(printf '%s' "${HF_TOKEN}" | tr -d '\r\n')"
          HF_SPACE_ID_CLEAN="$(printf '%s' "${HF_SPACE_ID}" | tr -d '\r\n')"
          if [ -z "${HF_TOKEN_CLEAN}" ] || [ -z "${HF_SPACE_ID_CLEAN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          printf 'hf_token=%s\n' "${HF_TOKEN_CLEAN}" >> "$GITHUB_OUTPUT"
          printf 'hf_space_id=%s\n' "${HF_SPACE_ID_CLEAN}" >> "$GITHUB_OUTPUT"

      - name: Skip when Hugging Face deployment is not configured
        if: steps.check.outputs.configured != 'true'
        run: echo "HF_TOKEN or HF_SPACE_ID is not configured; skipping Space deployment."

      - name: Prepare Space bundle
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p /tmp/hf-space
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'artifacts/test_tmp' \
            --exclude 'DL - Case Study - PPT.pdf' \
            ./ /tmp/hf-space/
          cp deploy/huggingface/SPACE_README.md /tmp/hf-space/README.md

      - name: Install Hugging Face CLI
        if: steps.check.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade huggingface_hub

      - name: Upload Space bundle with hf CLI
        if: steps.check.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ steps.check.outputs.hf_token }}
        run: |
          hf upload "${{ steps.check.outputs.hf_space_id }}" /tmp/hf-space . --repo-type space --delete="*" --commit-message "Deploy ${GITHUB_SHA}"
